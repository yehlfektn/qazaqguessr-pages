<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | QazaqGuessr</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f7f9fc;
        --surface: #ffffff;
        --text: #17202a;
        --muted: #5d6b7a;
        --border: #d9e2ec;
        --brand: #0478a8;
        --gold: #d6a839;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      .page {
        width: min(900px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0;
      }

      header,
      main,
      footer {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(31, 44, 71, 0.06);
      }

      header {
        padding: 24px;
        border-bottom: 4px solid var(--gold);
      }

      main {
        margin-top: 16px;
        padding: 28px;
      }

      footer {
        margin-top: 16px;
        padding: 18px 24px;
        color: var(--muted);
        font-size: 14px;
      }

      h1,
      h2,
      h3 {
        line-height: 1.22;
      }

      h1 {
        margin-top: 0;
      }

      a {
        color: var(--brand);
      }

      code {
        background: #eef4f8;
        border-radius: 4px;
        padding: 2px 5px;
      }

      .site-title {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
      }

      .site-subtitle {
        margin: 4px 0 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <p class="site-title">QazaqGuessr</p>
        <p class="site-subtitle">Public privacy and support pages</p>
      </header>

      <main>
        {{ content }}
      </main>

      <footer>
        This project is maintained by Nurdaulet Kenges.
      </footer>
    </div>
  </body>
</html>
